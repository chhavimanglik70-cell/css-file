
<!DOCTYPE html>
<html>
<head>
    <title>CSS Styling</title>

    <style>
        /* Element selector */
        body {
            background-image: url("https://images.unsplash.com/photo-1470770841072-f978cf4d019e");
            background-size: cover;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        /* Heading selector */
        h1 {
            color: darkblue;
            font-family: Georgia, serif;
            font-size: 40px;
            font-style: italic;
        }

        /* Paragraph selector */
        p {
            color: palevioletred;
            font-size: 20px;
            font-weight: bold;
        }

        /* Class selector */
        .box {
            background-image: url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee");
            background-size: cover;
            background-position: center;
            color: white;
            padding: 30px;
            margin: 30px;
            border: 2px solid black;
        }

        /* ID selector */
        #message {
            color: indigo;
            font-size: 24px;
            font-family: cursive;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Web Page</h1>

    <p>This is an example of CSS styling.</p>

    <div class="box">
        <h2>Beautiful Nature</h2>
        <p>CSS makes web pages attractive!</p>
    </div>

    <p id="message">Different selectors apply different styles.</p>
    <p id="message"> Chhavi Manglik</p>

</body>
</html>
